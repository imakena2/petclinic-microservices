name: Idah Branch CI

on:
  push:
    branches:
      - 'feature/GPM-*'
  pull_request:
    branches:
      - dev

jobs:
  validate:
    name: Validate Scrum Docs and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Build with Maven
        run: ./mvnw clean package -DskipTests

      - name: Verify docs structure
        run: |
          echo 'Verifying Scrum docs structure'
          ls docs/ || echo 'docs folder will be created by commits'
          echo 'Branch: ${{ github.ref_name }}'
          echo 'CI validation complete'

      - name: Build summary
        run: |
          echo '### Idah Branch CI' >> $GITHUB_STEP_SUMMARY
          echo '- Branch: ${{ github.ref_name }}' >> $GITHUB_STEP_SUMMARY
          echo '- Maven build: PASSED' >> $GITHUB_STEP_SUMMARY
          echo '- Docs: VALIDATED' >> $GITHUB_STEP_SUMMARY
          echo '- Target: dev branch' >> $GITHUB_STEP_SUMMARY
